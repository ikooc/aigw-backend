# ============================================================================
# AI 聚合网关 · 宝塔站点配置（CentOS 7.9 + nginx 1.30 + PHP 8.2）
# ----------------------------------------------------------------------------
# 用法：宝塔面板 → 网站 → 找到站点 → 设置 → 配置文件 → 用本文件**整体替换**。
#
# ⚠️ 替换前请先做两件事：
#   1. 确认下面的 PHP-FPM socket 路径与你的机器一致（见「此处需确认 ①」）。
#   2. 确认 server_name 已改成你的域名。
#
# ⚠️ 站点「网站目录」保持为项目根目录：/www/wwwroot/aigw
#    （即 index.php / .env / storage 的**上一层**所在目录）
#    应用入口在 public/index.php，由下面的 rewrite 转发，无需把目录指到 public。
#
# ⚠️ 「防跨站攻击(open_basedir)」建议**关闭**：
#    本项目需要在项目内读写 storage/，并在 Linux 下用 proc_open 起 Node 子进程；
#    open_basedir 限定到 public/ 会导致 .env 读不到、storage 不可写。
#
# ============================================================================
# ✅ 回源令牌闸门 —— **不需要动 http 块、不需要 map**
# ----------------------------------------------------------------------------
# 令牌校验有两种写法，效果**完全等价**，选一种即可：
#
#   写法 A（本文件默认，"零全局改动"）：**全部写在站点自己的 server 块里**，
#          用 `set` + `if` 实现。**不碰 nginx.conf、不新增 include 文件**。
#          —— 见本文件「⓪ 真实客户端 IP」下的启用块，取消注释即可。
#
#   写法 B（可选，多文件时更省 CPU）：在 http 块写一张 map。但 map 只能写在
#          http 块（宝塔 → Nginx → 配置修改），多一处全局改动，本文件**不采用**。
#
# 🔴 只要 nginx 编译了 `--with-http_realip_module`（宝塔默认带），两种写法都可用。
# 本文件的 server 块写法已用 nginx 1.25.2 实测通过：
#     · 无令牌 / 令牌错 → 403
#     · 令牌对        → 200，且 $remote_addr 正确还原为 XFF 最右值
#
# 口令生成： openssl rand -hex 32   （纯 hex，不会破坏 nginx 语法）
# 完整步骤见文件末尾「⓪-EO 腾讯云 EdgeOne 专章」。
# ============================================================================

server {
    listen 80;
    server_name example.com www.example.com;          # ← 改成你的域名

    # 站点根 = 项目根目录
    root /www/wwwroot/aigw;
    index index.php index.html;

    # 长上下文对话请求体可能较大（默认 1m 会直接 413）
    client_max_body_size 50m;

    # 文本类资源显式 UTF-8，避免浏览器按 latin-1 解码导致中文乱码
    charset utf-8;
    charset_types text/css application/javascript text/javascript application/json image/svg+xml;

    access_log /www/wwwlogs/example.com.log;
    error_log  /www/wwwlogs/example.com.error.log;

    # ------------------------------------------------------------------------
    # ⓪ 真实客户端 IP（安全关键，勿删）
    # ------------------------------------------------------------------------
    # fastcgi_pass_request_headers 默认 on，会把**客户端原始**的
    # X-Forwarded-For 原样透传给 PHP。应用层 ClientIp 在「直连来源属可信代理」
    # 时会采信 XFF —— 若不覆写，攻击者一个 `-H "X-Forwarded-For: 1.2.3.4"`
    # 就能伪造来源 IP，使**所有按 IP 的防护全部失效**：
    #   · 注册 IP 频控 / 发码 IP 频控（PublicGuard）
    #   · 取图限流 / 验证码答错锁定（CaptchaGuard）
    #   · 登录失败锁定（LoginGuard）
    #   · 审计日志里的来源 IP 记录
    #
    # 方案 A（无 CDN，裸站直连）—— 用 $remote_addr 覆写，**逐条 fastcgi 块都要加**。
    #    本文件已在两个 fastcgi 块内显式写上 `fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;`
    #
    # 方案 B（前置 CDN / 反代）—— 用 nginx real_ip 模块把 $remote_addr 本身还原成
    #    真实客户端 IP（这样上面那句覆写就自动是正确的值）。需要 nginx 编译了
    #    --with-http_realip_module（宝塔默认带）。
    #
    # 🔴 本站线上走**腾讯云 EdgeOne（EO）**，且**拿不到 EO 的回源 IP 段**
    #    （EO 段接口已下线）→ 用**回源令牌**（零 IP 段依赖）。
    #    ★ 下面这段**默认注释**：只有确认要启用 EO 方案时才放开。
    #      放开前请先：① 在 .env 填好 AIGW_ORIGIN_TOKEN；
    #                  ② 把下面的「口令占位」替换成你自己的口令。见专章。
    #      没配全就放开 = 全站 403。
    #
    # ── 启用块开始（EO 场景；口令替换后取消注释）────────────────────────────
    # ★ 无需 http 块 map：令牌校验直接写在 server 块里，效果与 map 完全等价。
    # set_real_ip_from 0.0.0.0/0;
    # real_ip_header    X-Forwarded-For;
    # real_ip_recursive off;          # 🔴 必须 off：真实 IP 在 XFF 最右（EO 追加语义）
    #
    # set $aigw_origin_ok 0;
    # if ($http_x_aigw_origin_token = "<把你的回源口令粘到这里>") {
    #     set $aigw_origin_ok 1;
    # }
    # if ($aigw_origin_ok = 0) { return 403; }   # 无正确回源令牌 → 拒绝（挡直连源站）
    # ── 启用块结束 ─────────────────────────────────────────────────────────
    #
    # ⚠️ 二者选一，不要既设 real_ip 又在 fastcgi 里覆写成别的值。
    # ⚠️ 口令里若含 `$` `}` `"` 会破坏 nginx 语法 → 用 openssl rand -hex 32
    #    生成的是纯 hex（64 字符），不会有这个问题。

    # ------------------------------------------------------------------------
    # ① 安全：敏感路径一律拒绝
    # ------------------------------------------------------------------------
    # ⚠️ 这一整段是**必须**的。项目自带的 nginx.htaccess 里有
    #      try_files $uri $uri/ /public/index.php
    #    而站点根就是项目根 —— 只要请求路径命中真实文件，nginx 会**直接吐出**它。
    #    于是下面这些会暴露在公网：
    #      · storage/logs/app-*.log       —— 明文对话留痕（含用户 prompt 原文）
    #      · storage/recover-bodies.sql   —— 3.5MB 完整请求体转储
    #      · storage/backup/binlog.*.bak  —— 数据库 binlog（78MB）
    #      · .env                         —— 数据库口令 + 凭据加密主密钥
    #      · database/schema.sql, tools/, tests/, app/（源码）
    #    下面用「目录前缀 + 扩展名」两道闸门封死。

    # 1) 敏感目录：整目录拒绝
    location ~ ^/(storage|database|docs|tools|tests|app|config|bootstrap|routes|bin|vendor|node_modules|\.workbuddy|\.git)(/|$) {
        return 404;
    }

    # 2) 敏感扩展名：.env / .sql / .log / .bak / .md / .json / .ini / .sh / .bat / .ps1 / .lock / htaccess
    #    注意：前端静态资源里没有这些类型，接口数据全部走 /api/* 由 PHP 输出，故可安全封禁。
    location ~* \.(env|sql|log|bak|md|ini|sh|bat|ps1|lock|yml|yaml|htaccess)$ {
        return 404;
    }

    # 3) 任意点文件（含 .htaccess / .user.ini / .env 等），保留 ACME 校验目录
    location ~ /\.(?!well-known) {
        return 404;
    }

    # 4) 根目录散落文件：不属于运行时资源，一律拒绝
    #    na-tree.json 是开发期 new-api 仓库快照（892KB），上线时本就不该上传；
    #    这里再兜一道，避免误传后暴露内部研究资料。
    location = /na-tree.json { return 404; }

    # 5) 项目自带的 Apache/nginx 规则文件本身（.htaccess 已被上条挡掉，
    #    nginx.htaccess 不带点前缀，需显式拒绝）
    location ~* /(nginx\.htaccess|\.env\.example)$ { return 404; }

    # ------------------------------------------------------------------------
    # ② 静态资源：URL /assets/** 实际位于 public/assets/**
    # ------------------------------------------------------------------------
    # 用 alias 直接映射（正则 location 里 alias 必须用捕获组拼接），
    # 比 rewrite 少一次内部跳转，且缓存头能正常生效。
    # ⚠️ alias 的值必须是**字面路径**，不能写 $document_root（nginx 直接报
    #    "the $document_root variable cannot be used in the alias directive"）。
    #    故这里与 root 保持一致写死；若你改了网站目录，这一行也要同步改。
    # 带版本号查询串时才长期缓存；无版本号则每次回源校验（与项目约定一致）。
    location ~* ^/assets/(.+\.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp))$ {
        alias /www/wwwroot/aigw/public/assets/$1;
        charset utf-8;
        charset_types text/css application/javascript text/javascript application/json image/svg+xml;
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
    }

    # ------------------------------------------------------------------------
    # ③ SSE 流式接口：关闭全部缓冲，保证逐块下发
    # ------------------------------------------------------------------------
    # 这是「只走精确匹配」的 location，优先级高于下面 catch-all 的 PHP 正则块。
    # ⚠️ 若把本段漏掉：nginx 会缓冲 SSE，前端表现为「等很久一次性吐完」甚至超时。
    location = /v1/chat/completions {
        fastcgi_pass   unix:/tmp/php-cgi-82.sock;   # ← 此处需确认 ①
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME  $document_root/public/index.php;
        # 覆写客户端伪造的 XFF（见文件头「⓪ 真实客户端 IP」）
        fastcgi_param  HTTP_X_FORWARDED_FOR  $remote_addr;
        include        fastcgi_params;

        fastcgi_buffering off;
        fastcgi_keep_conn on;
        gzip off;
        chunked_transfer_encoding on;

        # 与 PHP 侧 Response::MAX_EXECUTION_SECONDS = 300s 对齐
        # （略给余量：让 PHP 自己的超时错误先返回，而不是 nginx 先吐 504）
        fastcgi_read_timeout 360s;
        fastcgi_send_timeout 360s;
    }

    # ------------------------------------------------------------------------
    # ④ PHP 处理（宝塔标准写法）
    # ------------------------------------------------------------------------
    # 说明：这里**不要**用 `include enable-php-82.conf;` 的默认内容直接套 ——
    # 默认块带 `try_files $uri =404` 且不带 SSE 特化。本项目已在上面单独放了 SSE 段，
    # 这里给普通 PHP 使用。若你更想用宝塔生成的 enable-php-82.conf，见文末「备选写法」。
    location ~ [^/]\.php(/|$) {
        try_files $uri =404;
        fastcgi_pass  unix:/tmp/php-cgi-82.sock;     # ← 此处需确认 ①
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # 覆写客户端伪造的 XFF（见文件头「⓪ 真实客户端 IP」）
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        include fastcgi_params;

        # 登录/注册/管理接口不宜长挂，30s 足够；长尾只在 SSE 那段
        fastcgi_read_timeout 60s;
    }

    # ------------------------------------------------------------------------
    # ⑤ 入口与回退
    # ------------------------------------------------------------------------
    # 首页直接交给应用入口（否则会命中 index 列表末尾的默认页）
    rewrite ^/$ /public/index.php last;

    location / {
        # 真实存在的静态文件直出；其余（含 /api/*、/console、/admin、/v1/*）全部交给入口
        try_files $uri $uri/ /public/index.php?$query_string;
    }

    # 静态资源与页面均不缓存，确保代码更新后刷新即时生效
    location ~* \.(html|htm)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 禁止用 IP/未知域名直接访问（可选：把下面两行注释掉即可放开）
    # if ($host != 'example.com' ) { return 444; }
}

# ============================================================================
# 此处需确认 ① —— PHP-FPM socket 路径
# ----------------------------------------------------------------------------
# 上面所有 fastcgi_pass 都写成 unix:/tmp/php-cgi-82.sock，这是宝塔 PHP 8.2 的常见值。
# 请在服务器上执行下面任一命令确认（二选一，看到哪个就用哪个）：
#
#     ls -l /tmp/php-cgi-8*.sock
#     ls -l /www/server/php/82/var/run/*.sock
#
# 若实际是 127.0.0.1:9000 这类 TCP，则把两处 unix:... 改成 127.0.0.1:9000 即可。
# ============================================================================

# ============================================================================
# 备选写法（若你想继续用宝塔生成的 enable-php-82.conf）
# ----------------------------------------------------------------------------
# 把上面「④ PHP 处理」整段换成：
#
#     include enable-php-82.conf;
#
# 同时必须保证「③ SSE 流式接口」段存在（它靠精确匹配抢在 enable-php-82.conf 的
# 正则 location 之前生效）。这样改动最小，且继续跟随宝塔的 socket 配置。
#
# 🔴 但用了 enable-php-82.conf 就**没有** `fastcgi_param HTTP_X_FORWARDED_FOR` 覆写，
#    必须手工补上，否则客户端伪造的 XFF 会直达 PHP：
#      ① 编辑 /www/server/nginx/conf/enable-php-82.conf，在 include fastcgi_params; 之前加
#             fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
#      ② 或者不用 include，直接展开成显式 fastcgi 块（同上面「④ PHP 处理」的写法）。
# ============================================================================

# ============================================================================
# ⓪-EO 腾讯云 EdgeOne（EO）CDN 下的真实客户端 IP  —— 生产必读
# ----------------------------------------------------------------------------
# 🔴 **本节是本站线上的实际方案（零 IP 段依赖）**。EO 的回源 IP 段接口已下线
#    （api.edgeone.ai/ips 2026-07-31 停更 / 08-31 关停），拿不到段清单 →
#    `set_real_ip_from <EO 段>` 那套**不可用**（人工维护段清单必然过期）。
#    改用「回源令牌」：**一个只有你和 EO 知道的密钥**，取代「信任某个 IP 段」。
#
# ── 为什么必须要它（不配会怎样）────────────────────────────────────────────
#   · EO 回源时 $remote_addr = **EO 边缘节点 IP**，不是访客 IP；
#   · EO 会把「到边缘节点前的最后一跳」**追加**到 X-Forwarded-For **尾部**，
#     客户端自己伪造的 XFF 值原样留在**最左**（这就是最左不可信的原因）；
#   · EO 专有头 `EO-Connecting-IP` 才是与 EO 建连的客户端 IP。
#   两处都不可信时，全站访客会**塌缩进一两个限流桶** →
#   表现不是「限流失效」，而是 **真实用户被误伤 429**（一个人刷爆，所有人陪跑）。
#
# ── 三步部署（缺一步都不成立）──────────────────────────────────────────────
#
# 【第 1 步】EO 控制台
#   1a) 站点加速 → 回源配置 → 「**真实客户端 IP 回源**」= 开启。
#       （不开的话回源请求里不会有客户端 IP，后面全白搭）
#   1b) 站点加速 → 规则引擎 → 新建规则 → 操作选「**修改 HTTP 回源请求头**」
#       → 类型选 **「设置」(Set)**，新增一条：
#            头名 = x-aigw-origin-token         ← 与 .env 的 AIGW_ORIGIN_TOKEN_HEADER 一致
#            值   = <回源口令>                   ← 与 .env 的 AIGW_ORIGIN_TOKEN 一致
#            生成口令： openssl rand -hex 32
#
#   🔴🔴 **必须选「设置 / Set」，绝不能选「添加 / Add」** —— 这是本方案唯一的
#       致命坑。官方文档：`Add` 是「若该头已存在仍会追加，不覆盖已有头」；
#       `Set` 是「修改为设定值，且**该头唯一**」。
#       若用了 Add：攻击者只要自己发一个同名头，nginx 侧
#       `$http_x_aigw_origin_token` 就变成 `"伪造值, 真值"` → 与本处精确匹配
#       失败 → **全站 403**（攻击者能用一个头把站点打到不可用）。
#       用 Set 时客户端抢先发的同名头会被**替换掉**，攻击者无法干扰。
#       ★ 好消息：即便配错成 Add，故障是 **fail-closed 且立刻可见**（全员 403），
#         不是静默漂移 —— 改回 Set 即可。
#
#   1c)（可选，更稳）站点加速 → 网络优化 → 「**客户端 IP 头部**」开启，
#       自定义头名如 `x-aigw-client-ip`，然后把 .env 的
#       `AIGW_CLIENT_IP_HEADER=x-aigw-client-ip`。
#       为什么不直接用 `eo-connecting-ip`：EO 会**透传客户端所有请求头**，
#       客户端若自己发一个 `EO-Connecting-IP`，就可能出现重复头；
#       而 `EO-Connecting-IP` 恰好是规则引擎**不允许修改**的标准头之一
#       （不可 Set 覆盖）。自建专用头可彻底绕开这个不确定性。
#       注：应用层已用「取最右合法 IP」对抗重复头，直接用 eo-connecting-ip 也能工作。
#
# 【第 2 步】nginx（本文件，一处，**不需要动 http 块**）
#   2a) server 块 —— 本文件「⓪ 真实客户端 IP」处已写好模板（默认注释），
#       把口令替换后取消注释即可。核心是这几行：
#
#         set_real_ip_from 0.0.0.0/0;
#         real_ip_header    X-Forwarded-For;
#         real_ip_recursive off;              # ← 必须是 off，见下方红字
#
#         set $aigw_origin_ok 0;
#         if ($http_x_aigw_origin_token = "<口令>") { set $aigw_origin_ok 1; }
#         if ($aigw_origin_ok = 0) { return 403; }
#
#   2b) 为什么不用 http 块 map：map 指令**只能写在 http 块**，那会多改一处全局
#       配置（宝塔 → Nginx → 配置修改）。而 `set` + `if` 写在 server 块里，
#       行为与 map **完全等价**，且改动只落在站点自己的 vhost 文件内 ——
#       升级/迁移 nginx 时不会因为漏带那张 map 而突然报
#       `unknown "aigw_origin_ok" variable`。
#       ✅ 已用 nginx 1.25.2 实测：无令牌/错令牌 → 403；对令牌 → 200 且
#          $remote_addr 正确还原为 XFF 最右值。
#
#   🔴 **`set_real_ip_from 0.0.0.0/0` 单独用是不安全的**（等于信任任何直连来源的
#      XFF）。这里之所以安全，**完全依赖上面那条令牌闸门**：
#      直连源站伪造 IP 的攻击者带不对口令 → 403，根本进不到业务。
#      两者是**一对**，删掉任何一个都等于把防线拆了。
#
#   🔴 **`real_ip_recursive` 必须是 `off`**，这一条最反直觉：
#      真实客户端 IP 是在 XFF 的**最右**（EO 追加语义），不是最左。
#      `on` 时 nginx 会从右往左一路剥掉"可信段"，而我们信任了 0.0.0.0/0
#      （所有 IP 都算可信）→ 会一直剥到**最左** → 正好拿到客户端伪造的那个值，
#      防护彻底失效。`off` 时只取最后一个，正是 EO 写的真值。
#      题干对照：客户端发 `XFF: 1.2.3.4` → EO 回源头为 `1.2.3.4, <真实IP>`
#      → `off` 取最右 = 真实 IP ✅ ；`on` 取最左 = 1.2.3.4 ❌
#
# 【第 3 步】应用层 .env
#
#       AIGW_ORIGIN_TOKEN=<与 1b 相同的回源口令>
#       AIGW_ORIGIN_TOKEN_HEADER=x-aigw-origin-token
#       AIGW_CLIENT_IP_HEADER=eo-connecting-ip        # 或 1c 自建的头名
#       AIGW_TRUSTED_PROXIES=                          # 本方案下保持为空即可
#
#   生成： openssl rand -hex 32
#
# ── 与「⓪ 真实客户端 IP」的关系（为什么 2b 之后那句覆写是对的）─────────────
#   本文件两个 fastcgi 块里都有：
#         fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
#   在 EO 场景下，只要 2b 的 real_ip 模块生效，`$remote_addr` **本身已经被还原成
#   真实客户端 IP** —— 于是这句覆写写进 PHP 的就是正确值，客户端伪造的 XFF
#   被这一句彻底抹掉。**这正是为什么 2a/2b 与这句覆写必须同时存在**：
#    - 只有覆写、没有 real_ip → PHP 拿到 EO 节点 IP（全站共桶）
#    - 只有 real_ip、没有覆写 → 客户端伪造的 XFF 仍会作为原始头直达 PHP，
#      ClientIp 在"可信代理"分支下可能采信它
#
# ── 验证（必须走真实 HTTP，CLI 测不出这条链路）──────────────────────────────
#   ① 不带口令直连源站 IP → 期望 403
#        curl -sI http://<源站IP>/api/site-config
#   ② 带对口令直连 → 期望 200
#        curl -sI -H "x-aigw-origin-token: <口令>" http://<源站IP>/api/site-config
#   ③ 走域名（过 EO）→ 应返回你自己的真实公网 IP，且伪造 XFF 不生效
#        curl -s https://<域名>/api/client-ip
#
#   ⚠️ 判据不是"有没有配好"，而是 ③ 返回的 IP **是不是你自己的公网 IP**。
#      如果返回 127.0.0.1 / 内网地址 / 机房地址，就是这条链路没通。
#
# ── 附：有确切 EO 回源段时的正统写法（可选，作为纵深防御的第二层）───────────
#   若能拿到段清单（控制台「安全防护 → 源站防护」），可把上面 0.0.0.0/0 收窄：
#
#       set_real_ip_from 1.2.3.0/24;      # ← 逐个替换成 EO 回源段
#       set_real_ip_from 127.0.0.1;
#       real_ip_header X-Forwarded-For;
#       real_ip_recursive off;            # 仍然必须是 off
#
#   ⚠️ 收窄后**不要删令牌闸门** —— 段清单会过期（EO 已下线段接口就是明证），
#      令牌是唯一不会随时间失效的那一层。
# ============================================================================


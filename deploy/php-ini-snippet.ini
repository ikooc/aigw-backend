; ============================================================================
; AI 聚合网关 · php.ini 补充配置（宝塔 PHP 8.2）
; ----------------------------------------------------------------------------
; 用法：宝塔面板 → 软件商店 → PHP 8.2 → 设置 → 配置修改
;       把下面各项的**值**改到对应位置（不要整段粘贴，宝塔的 php.ini 已有这些键）。
;
; ⚠️ 改完 php.ini **必须重启 PHP**（设置页里的「重载配置」不够，要「重启」）。
;    原因见 docs/开发约定与踩坑.md §13.2：php.ini 的值由 SAPI 在**启动时冻结**，
;    已运行的 php-fpm worker 会一直沿用旧值 —— 表现为「配置明明改了却不生效」。
; ============================================================================

; ---------------------------------------------------------------------------
; 1. 执行时间上限
; ---------------------------------------------------------------------------
; 本项目代码在网关入口显式 set_time_limit(300)（见 Response::MAX_EXECUTION_SECONDS），
; 所以这个 ini 值**不是**长请求的最终决定因素。但仍建议设为 300 保持一致：
; 三层对齐 = nginx 360s ≥ PHP 300s ≥ 业务预算(120s/45s)。
;
;   宝塔默认值通常是 300，确认一下即可。
max_execution_time = 300

; 与之配套：输入解析超时（一般保持 -1 不限制）
max_input_time = -1

; ---------------------------------------------------------------------------
; 2. 内存
; ---------------------------------------------------------------------------
; 本项目会整体读入 3.5MB recover-bodies.sql 之类的文件、并在流式场景拼接缓冲，
; 但常规对话每条占用不大。256M 足够；若开大量模型目录同步可提到 512M。
memory_limit = 256M

; ---------------------------------------------------------------------------
; 3. 上传与 POST 体积
; ---------------------------------------------------------------------------
; 长上下文对话的请求体可能很大。若 nginx 已放行 50m，PHP 这层不要成为瓶颈。
; ⚠️ 两者必须**同时**放大：nginx client_max_body_size 先拦，PHP 后拦，
;    只改一边时另一边的默认值（nginx 1m / PHP 8M）会先报错。
post_max_size = 50M
upload_max_filesize = 50M

; ---------------------------------------------------------------------------
; 4. 时区
; ---------------------------------------------------------------------------
; 影响日志时间戳、签到/旅行等「按天/按小时」的判定。
date.timezone = Asia/Shanghai

; ---------------------------------------------------------------------------
; 5. 错误显示（生产环境）
; ---------------------------------------------------------------------------
; 入口 public/index.php 已强制 display_errors=0 并重定向到 storage/logs/php-error.log，
; 这里设成一致值即可（双重保险）。
display_errors = Off
log_errors = On
error_reporting = E_ALL

; ---------------------------------------------------------------------------
; 6. Session
; ---------------------------------------------------------------------------
; ⚠️ 入口 public/index.php 会强制 session_save_path(项目内 storage/sessions)，
;    所以这里设为项目绝对路径只是为了「CLI / 其他入口」也能一致。
;    若你不设，PHP 会回退到系统临时目录，php-cgi 各 worker 解析不一致时
;    会出现「登录成功、刷新就掉登录」的经典问题（项目已踩过，故在入口里写死了）。
session.save_path = "/www/wwwroot/aigw/storage/sessions"
session.gc_maxlifetime = 604800
session.cookie_httponly = 1
; 若启用 HTTPS 后，取消下一行注释（Cookie 仅走加密通道）
; session.cookie_secure = 1

; ---------------------------------------------------------------------------
; 7. OPcache（性能关键）
; ---------------------------------------------------------------------------
; 本项目无 Composer、每次请求都要 PSR-4 自动加载 + 解析 90+ 个 PHP 文件，
; OPcache 开启与否对首字节时间影响显著。
opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20011
opcache.interned_strings_buffer = 16

; ⚠️ validate_timestamps 的取舍（这是「改了代码不生效」的头号原因）：
;     1 = 每次请求都检查文件 mtime，改码即时生效（开发/频繁更新用，推荐）
;     0 = 完全不检查，性能最好，但**改完代码必须重启 PHP 才生效**
;   本项目线上会持续迭代，这里推荐 1 + 合理的 revalidate_freq。
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60

; ---------------------------------------------------------------------------
; 8. 禁用函数（★ 最容易踩的坑）
; ---------------------------------------------------------------------------
; 宝塔默认的 disable_functions 会禁掉一批函数，其中 **proc_open** 是
; 「ZCode 领额度验证码求解」的硬依赖 —— 被禁则该功能静默失效（只在日志里
; 留一行 warn，界面上只是「领取失败」）。
;
; 请到 宝塔 → PHP 8.2 → 设置 → 禁用函数 里，**删除 proc_open**（若还需要它）。
; 若你不需要「ZCode 领额度」这个功能，可以保持禁用，其他功能不受影响。
;
; 参考：宝塔常见默认禁用列表（各家版本略有差异，请以面板实际显示为准）
;   passthru,exec,system,chroot,chgrp,chown,shell_exec,proc_open,proc_get_status,
;   ini_alter,ini_restore,dl,openlog,syslog,readlink,symlink,popen
;
; 本项目对这批函数的实际依赖：
;   · proc_open  —— 验证码求解（必需，若不删则该功能不可用）
;   · shell_exec —— Node 路径兜底探测 / 预检脚本的 --probe 实测（可选，
;                    设了 AIGW_NODE_BIN 环境变量即可绕过）
;   · exec/system/passthru —— 完全未使用，可保持禁用
;
; 上线前可用 `php -r 'var_dump(function_exists("proc_open"));'` 确认这两项的状态。

; ---------------------------------------------------------------------------
; 9. 出站连接超时（上游调用）
; ---------------------------------------------------------------------------
; 本项目 HttpClient 用 curl 并自带超时设置，这里仅作为兜底。
default_socket_timeout = 120

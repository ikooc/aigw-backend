; ============================================================================
; AI 聚合网关 · PHP-FPM 池配置补充（宝塔 PHP 8.2）
; ----------------------------------------------------------------------------
; 用法：宝塔面板 → 软件商店 → PHP 8.2 → 设置 → 「FPM 配置」/「性能调整」
;       或直接编辑 /www/server/php/82/etc/php-fpm.d/www.conf
;
; 改完必须重启 PHP： php-fpm 或 宝塔「重启」按钮。
; ============================================================================

; ---------------------------------------------------------------------------
; ★ 最关键的一项：请求终止超时
; ---------------------------------------------------------------------------
; 语义：PHP-FPM master 会在这个时间后**强杀** worker（SIGTERM），
;       无论 PHP 内部怎么 set_time_limit 都救不回来。
;
; 本项目 SSE 流式对话最长实测 215.8s（租约排队 + 上游重采样），
; 代码里已 set_time_limit(300)、nginx 也放到 360s —— 若这一层仍是默认值，
; 就会出现「浏览器转圈到一半被掐断、且 PHP 日志里没有任何报错」的诡异现象，
; 因为进程是被 FPM master 杀掉的，不是 PHP 自己超时。
;
; 对齐关系（约定 14 超时三层对齐）：
;     nginx fastcgi_read_timeout 360s
;       ≥ PHP-FPM request_terminate_timeout 330s
;         ≥ PHP max_execution_time / set_time_limit 300s
;           ≥ 业务预算 120s / 45s
;
; 取 330s 而非 360s 的理由：让 PHP 自己的超时错误**先**返回给客户端
; （可读的业务错误），而不是让 nginx 吐一个 504。
request_terminate_timeout = 330s

; ---------------------------------------------------------------------------
; 进程管理
; ---------------------------------------------------------------------------
; 本项目是无状态 HTTP 应用，单请求可能占用较久（SSE 长连接）。
; 若 pm.max_children 太小，几个并发长连接就会把池占满，后续请求排队。
; 按机器内存调整：每个 worker 约 40-80MB。
;
; 1核1G 的建议值（宝塔默认通常是 static + max_children=50，对 1G 机器偏大）：
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

; 2核2G 可放宽到：
; pm.max_children = 40
; pm.start_servers = 8
; pm.min_spare_servers = 4
; pm.max_spare_servers = 16

; 4核4G+ 可放宽到 80~120。

; ---------------------------------------------------------------------------
; ★ 长请求期间不要重复收割
; ---------------------------------------------------------------------------
; max_requests 达到后 worker 会自我回收。SSE 长连接场景下若设得太小，
; 可能在流式输出中途回收 worker 导致连接中断。0 = 不限制（推荐）。
pm.max_requests = 0

; 单个请求处理完后的状态清理
pm.status_path = /phpfpm_status_aigw

; ---------------------------------------------------------------------------
; 慢日志（排查「为什么这次特别慢」很有用）
; ---------------------------------------------------------------------------
; 超过 5 秒的请求会记录调用栈。即便平时不看，出事时是唯一的现场。
request_slowlog_timeout = 5s
slowlog = /www/server/php/82/var/log/php-fpm-slow-aigw.log

; ---------------------------------------------------------------------------
; 环境变量透传（若你在 .env 之外还用了系统环境变量）
; ---------------------------------------------------------------------------
; ⚠️ PHP-FPM 默认**不继承**系统环境变量。本项目的 AIGW_NODE_BIN /
;    AIGW_BROWSER_BIN 支持通过 $_ENV / $_SERVER / getenv() 读取
;    （.env 只灌 $_ENV，池 env[XXX] 才进 getenv，两条路代码都认）——
;    但只在你把它们写进这个池配置（或 .env）时才有效。
;    写在 shell 的 ~/.bashrc 里对 FPM 是**无效**的，这是常见误区。
;
; ★ AIGW_NODE_BIN 必须是 ≥ 20.10 的 node（推荐 22）：
;   求解器依赖全局 WebSocket，而它自 v21.0.0 / v20.10.0 才加入，
;   Node 18 与宝塔默认的 v16 **都没有**，会直接启动失败。
;   ★ CentOS 7 还有第二道墙：官方 Node 18+ 需要 glibc 2.28，而 CentOS 7 是 2.17
;     → 必须用 glibc-217 专用构建（文件名含 -glibc-217），**切勿升级系统 glibc**。
;   自查判据：  /usr/local/nodejs/bin/node -e "console.log(process.version, typeof WebSocket)"
;   要输出末尾 function；报 GLIBC not found 即说明拿错包了。
;   详见 docs/部署-centos7-宝塔.md §8.1
;
; 例如：
; env[AIGW_NODE_BIN] = /usr/local/nodejs/bin/node
; env[AIGW_BROWSER_BIN] = /usr/bin/google-chrome-stable

; ---------------------------------------------------------------------------
; 可选：进程可读可写的目录白名单
; ---------------------------------------------------------------------------
; 若宝塔开了 open_basedir（「防跨站攻击」），需要放行项目根目录：
; php_admin_value[open_basedir] = /www/wwwroot/aigw:/tmp
;
; ⚠️ 本项目需要在项目内读写 storage/，并用 proc_open 起 Node 子进程，
;    若 open_basedir 只限定到 public/ 会导致 .env 读不到、storage 不可写。
;    建议在宝塔面板里直接**关闭**「防跨站攻击」，比手工配白名单更省事。
